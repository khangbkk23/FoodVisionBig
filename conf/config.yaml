system:
  active_model: "efficientnet"

dataset:
  name: "food101"
  data_dir: "data/"
  image_size: 224
  batch_size: 32
  num_workers: 4
  pin_memory: true
  download: true

training:
  epochs: 50
  learning_rate: 0.0001
  weight_decay: 0.0001
  seed: 42
  device: "cuda"
  checkpoint_dir: "model_checkpoints/"

custom_cnn:
  num_classes: 101
  model_name: "custom_cnn"
  in_channels: 3
  base_filters: 32
  dropout_rate: 0.5

efficientnet:
  num_classes: 101
  model_name: "efficientnet_b0"
  pretrained: true
  fine_tune: true
  unfreeze_layers: 30